
name: alert360_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  http: ^1.6.0
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  just_audio: ^0.10.6
  video_player: ^2.14.1
  flutter_native_splash: ^2.4.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  

# Configuration de l'icône de l'application
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/icons/app_icon.png
  android: true
  ios: false

  android_12:
    color: "#FFFFFF"
    image: assets/images/icons/app_icon.png
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
